[package]
name = "clickplanet-webapp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate-atlas"
path = "src/scripts/generate_atlas.rs"

[[bin]]
name = "compute-points"
path = "src/scripts/compute_points.rs"

[dependencies]
clickplanet-proto = { path = "../clickplanet-proto" }
clickplanet-globe-protocol = { path = "../clickplanet-globe-protocol" }
serde = {workspace = true, features = ["derive"] }
prost.workspace = true
anyhow = "1.0"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }
serde_json = "1.0"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
rand = "0.9.1"
base64 = "0.22.1"
bytemuck = { version = "1.14", features = ["derive"] }
lazy_static = "1.4.0"
async-trait = "0.1.83"
futures-util = "0.3.31"
# Used by both the web globe and the native compute-points script.
glam = "0.30.1"
# Spatial index used to pick the tile under the pointer.
rstar.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
raw-window-handle = "0.6.0"
wasm-bindgen = { version = "0.2.89", features = ["serde-serialize"] }
web-sys = { version = "0.3", features = [
    "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "console",
    "Window", "Document", "Element", "HtmlElement", "Node", "BinaryType",
    "CanvasRenderingContext2d", "HtmlCanvasElement", "MouseEvent", "EventTarget",
    "EventListener", "Event", "DomRect", "GpuCanvasContext", "Navigator",
    "WebGlBuffer", "WebGlProgram", "WebGlRenderingContext", "WebGlShader",
    "WebGlTexture", "WebGl2RenderingContext", "Performance",
    "Location", "UrlSearchParams", "PointerEvent", "AbortSignal", "Response", "Blob",
    "ImageBitmap", "ImageBitmapOptions", "ResizeQuality", "PremultiplyAlpha",
    "ColorSpaceConversion", "EventSource", "Storage", "Url", "Worker", "WorkerOptions",
    "WorkerType", "MessageChannel", "MessagePort", "OffscreenCanvas", "PerformanceMark" ] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-futures = "0.4.39"
gloo-net = "0.6.0"
gloo-storage = "0.3.0"
gloo-utils = { version = "0.2.0", features = ["serde"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
gloo-console = "0.3.0"
gloo-render = "0.2.0"
futures = "0.3.31"
wgpu = { version = "25.0.0", features = ["webgl", "webgpu", "wgsl"], default-features = false }
getrandom = { version = "0.2.10", features = ["js"] }
console_log = "1.0.0"
dioxus = { version = "0.6.2", features = ["web", "router"] }
dioxus-web = { version = "0.6.2" }
dioxus-hooks = "0.6.2"
dioxus-router = "0.6.3"
log = "0.4.22"