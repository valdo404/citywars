[package]
name = "clickplanet-client"
version = "0.1.0"
edition = "2021"
description = "A Rust client for the ClickPlanet game"
license = "MIT"
repository = "https://github.com/valdo404/clickplanet-client"

[lib]
name = "clickplanet_client"
path = "src/lib.rs"

[dependencies]
clickplanet-proto = { path = "../clickplanet-proto" }

# Core dependencies from workspace
prost.workspace = true
futures.workspace = true
url.workspace = true
base64.workspace = true
rand = { version = "0.8.5", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
serde.workspace = true
serde_json.workspace = true
futures-util = "0.3.31"
futures-channel = "0.3.31"
reqwest = { workspace = true, features = ["json"] }
async-trait = "0.1.77"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "time"] }
tokio-tungstenite.workspace = true
imp = "0.1.0"
tokio-retry.workspace = true
http = "1.3.1"
tungstenite = "0.26.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "WebSocket", "MessageEvent", "BinaryType", "ErrorEvent",
    "Event", "EventTarget", "console", "Window", "Document"
] }
js-sys = "0.3"
gloo-utils = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
http = "1.3.1"