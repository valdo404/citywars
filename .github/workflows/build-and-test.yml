name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Only used as a compile-time base URL by the web app; CI never downloads from it.
  CITYWARS_STATIC_SITE: "https://storage.googleapis.com/lv-project-313715-clickwars-static/static"
  DIOXUS_CLI_VERSION: "0.6.3"
  # Must match the wasm-bindgen crate version in Cargo.lock (used for the globe bundle).
  WASM_BINDGEN_VERSION: "0.2.129"

jobs:
  native:
    name: Build and Test Native
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Protobuf Compiler (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native

      - name: Build
        run: cargo build --workspace --all-targets

      # The Redis tests start a container through testcontainers (Docker is available on the runner).
      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets

  server-modes:
    name: Server (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: nats
            features: ""
          - mode: nonats
            features: "--no-default-features --features nonats"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Protobuf Compiler (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: server-${{ matrix.mode }}

      - name: Build
        run: cargo build -p clickplanet-server --all-targets ${{ matrix.features }}

      # includes the SSE tests (live events, Last-Event-ID resumption, resync, heartbeat)
      - name: Test
        run: cargo test -p clickplanet-server ${{ matrix.features }}

      - name: Clippy
        run: cargo clippy -p clickplanet-server --all-targets ${{ matrix.features }}

      - name: nats and nonats are mutually exclusive
        if: matrix.mode == 'nonats'
        run: |
          if cargo check -p clickplanet-server --features nonats 2> check.log; then
            echo "expected a compile error with both nats and nonats"; exit 1
          fi
          grep -q "mutually exclusive" check.log

  webassembly:
    name: Build WebAssembly
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Protobuf Compiler (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install Dioxus CLI
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
          locked: true

      - name: Install wasm-bindgen CLI
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
          locked: true

      # clickplanet-webapp/.cargo/config.toml selects the wasm32 target and the web_sys_unstable_apis cfg.
      - name: Clippy (wasm32)
        working-directory: clickplanet-webapp
        run: |
          cargo clippy
          cargo clippy -p clickplanet-globe --target wasm32-unknown-unknown

      - name: Build web bundles (Dioxus interface + globe)
        working-directory: clickplanet-webapp
        run: ./build-web.sh --release

      - name: Package web bundle
        run: tar czf clickplanet-webapp.tar.gz -C clickplanet-webapp/dist .

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: clickplanet-webapp
          path: clickplanet-webapp.tar.gz

  docker:
    name: Build Docker Images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Images
        run: docker compose -f docker-compose.yml build

      - name: Build and smoke-test the Cloud Run image (no NATS)
        run: |
          docker build -f Dockerfile.cloudrun -t citywars-cloudrun .
          docker run -d --name citywars-cloudrun -e PORT=8080 -p 8080:8080 citywars-cloudrun
          for i in $(seq 1 30); do curl -sf localhost:8080/v2/rpc/leaderboard && break; sleep 1; done
          curl -sf localhost:8080/v2/rpc/leaderboard
          { curl -s -m 3 -D - -o /dev/null localhost:8080/v2/events || true; } | grep -i "content-type: text/event-stream"
          docker rm -f citywars-cloudrun

      # Publishing only happens from main; pull requests just check that the images build.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker compose -f docker-compose.yml push
