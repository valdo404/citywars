name: CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Only used as a compile-time base URL by the web app; CI never downloads from it.
  CITYWARS_STATIC_SITE: "https://storage.googleapis.com/lv-project-313715-clickwars-static/static"
  DIOXUS_CLI_VERSION: "0.6.3"

jobs:
  native:
    name: Build and Test Native
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Protobuf Compiler (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native

      - name: Build
        run: cargo build --workspace --all-targets

      # The Redis tests start a container through testcontainers (Docker is available on the runner).
      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets

  webassembly:
    name: Build WebAssembly
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Protobuf Compiler (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install Dioxus CLI
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
          locked: true

      # clickplanet-webapp/.cargo/config.toml selects the wasm32 target and the web_sys_unstable_apis cfg.
      - name: Clippy (wasm32)
        working-directory: clickplanet-webapp
        run: cargo clippy

      - name: Build web bundle with Dioxus
        working-directory: clickplanet-webapp
        run: ./build-web.sh --release

      - name: Package web bundle
        run: tar czf clickplanet-webapp.tar.gz -C clickplanet-webapp/dist .

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: clickplanet-webapp
          path: clickplanet-webapp.tar.gz

  docker:
    name: Build Docker Images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Images
        run: docker compose -f docker-compose.yml build

      # Publishing only happens from main; pull requests just check that the images build.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker compose -f docker-compose.yml push
